name: ZhiFlo upstream sync and release

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: Test and publish even when upstream has no new commits
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: zhiflo-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: LibreChat-AI/LibreChat
  IMAGE_NAME: ghcr.io/zhiflo/librechat

jobs:
  sync-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out ZhiFlo fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "zhiflo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" 2>/dev/null || true
          git fetch --prune upstream main

      - name: Detect upstream changes
        id: detect
        env:
          FORCE_RELEASE: ${{ inputs.force_release || 'false' }}
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            upstream_changed=false
          else
            upstream_changed=true
          fi
          if [ "$upstream_changed" = "true" ] || [ "$FORCE_RELEASE" = "true" ]; then
            should_run=true
          else
            should_run=false
          fi
          echo "upstream_changed=$upstream_changed" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Merge upstream main
        if: steps.detect.outputs.upstream_changed == 'true'
        run: git merge --no-edit upstream/main

      - name: Set up Node
        if: steps.detect.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.should_run == 'true'
        run: npm ci --no-audit

      - name: Run static checks
        if: steps.detect.outputs.should_run == 'true'
        run: npm run static-checks

      - name: Test client
        if: steps.detect.outputs.should_run == 'true'
        run: npm run test:client

      - name: Test API
        if: steps.detect.outputs.should_run == 'true'
        run: npm run test:api

      - name: Build frontend
        if: steps.detect.outputs.should_run == 'true'
        run: npm run frontend:ci

      - name: Push merged main
        if: steps.detect.outputs.upstream_changed == 'true'
        run: git push origin HEAD:main

      - name: Set image metadata
        if: steps.detect.outputs.should_run == 'true'
        id: image
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date_tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.detect.outputs.should_run == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.detect.outputs.should_run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.detect.outputs.should_run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ZhiFlo LibreChat
        if: steps.detect.outputs.should_run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ steps.image.outputs.short_sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.date_tag }}-${{ steps.image.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ZhiFlo/LibreChat
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
            org.opencontainers.image.title=ZhiFlo AI
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report failed sync, test, or release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="LibreChat upstream sync failed: $(date -u +%Y-%m-%d)"
          body="Automated ZhiFlo LibreChat upstream sync/test/release failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. No release should be deployed until this run is fixed."
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue comment "$existing" --body "$body"
          fi
